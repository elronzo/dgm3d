name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL and numpy (system Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-numpy python3-scipy python3-pytest
      - name: Run tests
        run: /usr/bin/python3 -m pytest -q
